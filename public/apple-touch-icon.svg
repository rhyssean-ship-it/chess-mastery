<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0%" stop-color="#2a3340"/>
      <stop offset="60%" stop-color="#161a22"/>
      <stop offset="100%" stop-color="#0a0c12"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="b1"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b2"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded tile -->
  <rect width="512" height="512" rx="84" ry="84" fill="url(#bg)"/>

  <!-- Glowing pieces -->
  <g filter="url(#glow)" fill="none" stroke="url(#cyan)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- King (left): cburnett path, recoloured -->
    <g transform="translate(38 110) scale(4.5)">
      <path stroke-linejoin="miter" d="M22.5 11.63V6M20 8h5"/>
      <path stroke-linecap="butt" stroke-linejoin="miter" d="M22.5 25s4.5-7.5 3-10.5c0 0-1-2.5-3-2.5s-3 2.5-3 2.5c-1.5 3 3 10.5 3 10.5"/>
      <path d="M11.5 37c5.5 3.5 15.5 3.5 21 0v-7s9-4.5 6-10.5c-4-6.5-13.5-3.5-16 4V27v-3.5c-3.5-7.5-13-10.5-16-4-3 6 5 10 5 10z"/>
      <path d="M11.5 30c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0"/>
    </g>
    <!-- Knight (right): cburnett path, recoloured -->
    <g transform="translate(264 110) scale(4.5)">
      <path d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21"/>
      <path d="M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1.042-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4.003 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-.994-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-1.992 2.5-3c1 0 1 3 1 3"/>
      <!-- eye + nostril (neon dots) -->
      <circle cx="9.5" cy="25.5" r="0.6" fill="url(#cyan)" stroke="none"/>
      <ellipse cx="14.9" cy="15.75" rx="0.6" ry="1.4" transform="rotate(30 14.9 15.75)" fill="url(#cyan)" stroke="none"/>
    </g>
  </g>
</svg>
